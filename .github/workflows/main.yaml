name: Main

on:
  push:
    branches:
      - 'feature/run-in-container'

jobs:
  podman:
    name: "Podman"
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - name: "System info"
        run: sh -xec "uname -a; podman info; cat /proc/cpuinfo; df -h; whoami; id; cat /etc/subuid; cat /etc/subgid; cat /etc/passwd; cat /etc/hosts"
      - uses: actions/checkout@v3
      - name: "Make"
        run: IMAGE="ghcr.io/$(echo -n ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" make image
      - name: "Clean up (To avoid `node.kubernetes.io/disk-pressure` taint)"
        run: podman builder prune -f
      - name: Push image to GHCR
        run: |
          podman login ghcr.io/$(echo -n ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]') -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }} && \
          podman push ghcr.io/$(echo -n ${{ github.repository }} | tr '[:upper:]' '[:lower:]'):latest && \
          podman logout ghcr.io/$(echo -n ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')
      - name: "Smoke test (single-node)"
        run: |
          podman login ghcr.io/$(echo -n ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]') -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }} && \
          ./hack/smoketest-podman.sh u7s-test-crio ghcr.io/$(echo -n ${{ github.repository }} | tr '[:upper:]' '[:lower:]') && \
          podman logout ghcr.io/$(echo -n ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')
      - name: "Smoke test (multi-node cluster with Flannel)"
        run: ./hack/smoketest-podman-compose.sh
