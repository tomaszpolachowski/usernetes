#      - tls-master:/opt/usernetes/.config/usernetes/master
#      - tls-node-worker-2:/opt/usernetes/.config/usernetes/node
  init-certs:
    image: ghcr.io/tomaszpolachowski/usernetes
    entrypoint: /bin/bash
    environment:
      XDG_RUNTIME_DIR: '/opt/usernetes/run'
    user: usernetes
    command:
      - -c
      - /usr/bin/mkdir -p /opt/usernetes/run && mkdir -p /opt/usernetes/run && /opt/usernetes/common/cfssl.sh --dir=/opt/usernetes/.config/usernetes --master=master --node=master,10.100.0.100 --node=worker-1,10.100.0.101 #--node=worker-2,10.100.0.102 #&& /bin/ls -laR /opt/usernetes/run && /usr/bin/sleep infinity
    privileged: true
    tty: true
    hostname: master
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - tmp:/tmp
      - run:/run
      - runlock:/run/lock
      - tls-master:/opt/usernetes/.config/usernetes/master
      - tls-node-master:/opt/usernetes/.config/usernetes/nodes.master
#      - tls-node-2:/home/user/.config/usernetes/nodes.node-2
