version: "3"

services:
  master:
    depends_on:
      init-certs:
        condition: service_completed_successfully
    image: ghcr.io/tomaszpolachowski/usernetes
    privileged: true
    tty: true
    ports:
      - 127.0.0.1:6443:6443
    hostname: master
    networks:
      usernetes:
        ipv4_address: 10.100.0.100
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - tmp-master:/tmp
      - run-master:/run
      - runlock-master:/run/lock
      - tls-master:/opt/usernetes/.config/usernetes/master
      - tls-node-master:/opt/usernetes/.config/usernetes/node
  worker-1:
    depends_on:
      init-certs:
        condition: service_completed_successfully
    image: ghcr.io/tomaszpolachowski/usernetes
    privileged: true
    tty: true
    hostname: worker-1
    networks:
      usernetes:
        ipv4_address: 10.100.0.101
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - tmp-worker-1:/tmp
      - run-worker-1:/run
      - runlock-worker-1:/run/lock
      - tls-master:/opt/usernetes/.config/usernetes/master
      - tls-node-worker-1:/opt/usernetes/.config/usernetes/node
#  worker-2:
#    depends_on:
#      init-certs:
#        condition: service_completed_successfully
#    image: ghcr.io/tomaszpolachowski/usernetes
#    privileged: true
#    tty: true
#    hostname: worker-2
#    networks:
