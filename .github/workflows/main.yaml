name: Main
on: [push, pull_request]
env:
  DOCKER_BUILDKIT: 1
jobs:
  docker:
    name: "Docker"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: "System info"
        run: sh -xec "uname -a; podman info; cat /proc/cpuinfo; df -h"
      - uses: actions/checkout@v3
      - name: "Make"
        run: IMAGE="ghcr.io/$(echo -n ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" make image
      - name: "Clean up (To avoid `node.kubernetes.io/disk-pressure` taint)"
        run: |
          make clean
          podman builder prune -f
      - name: "Smoke test (CRI-O)"
        run: ./hack/smoketest-podman.sh u7s-test-crio ghcr.io/$(echo -n ${{ github.repository }} | tr '[:upper:]' '[:lower:]')
      - name: "Smoke test (multi-node cluster with Flannel)"
        run: ./hack/smoketest-podman-compose.sh
