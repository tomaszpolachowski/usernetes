name: Main

on:
  push:
    branches:
      - 'feature/run-in-container'

jobs:
  test:
    name: "Smoke tests"
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - name: "System info"
        run: sh -xec "uname -a; podman info; cat /proc/cpuinfo; df -h; whoami; id; cat /etc/subuid; cat /etc/subgid; cat /etc/passwd; cat /etc/hosts"
      - name: "Checkout"
        uses: actions/checkout@v3
      # - name: "Check Docker"
      #   run: sh -xec "docker version; docker info; docker run -dt --privileged --entrypoint /lib/systemd/systemd --name systemd-ubuntu --tmpfs /tmp --tmpfs /run --tmpfs /run/lock -v /sys/fs/cgroup:/sys/fs/cgroup:ro quay.io/flysangel/jrei/systemd-ubuntu:26.04 --system --unit=multi-user.target; sleep 5; docker logs systemd-ubuntu; docker exec -t systemd-ubuntu /usr/bin/systemctl status --no-pager; docker rm -f systemd-ubuntu"
      # - name: "Make"
      #   run: IMAGE="ghcr.io/$(echo -n ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" make image
      # - name: "Clean up (To avoid `node.kubernetes.io/disk-pressure` taint)"
      #   run: podman builder prune -f
      # - name: Push image to GHCR
      #   run: |
      #     podman login ghcr.io/$(echo -n ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]') -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }} && \
      #     podman push ghcr.io/$(echo -n ${{ github.repository }} | tr '[:upper:]' '[:lower:]'):latest && \
      #     podman logout ghcr.io/$(echo -n ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')
      # - name: "Smoke test (single-node in Podman)"
      #   run: |
      #     sudo podman login ghcr.io/$(echo -n ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]') -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }} && \
      #     sudo ./hack/smoketest-podman.sh u7s-test-crio ghcr.io/$(echo -n ${{ github.repository }} | tr '[:upper:]' '[:lower:]'):latest && \
      #     sudo podman logout ghcr.io/$(echo -n ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')
      # - name: "Smoke test (multi-node cluster with Flannel in Podman)"
      #   run: |
      #     sudo apt-get install -y podman-compose && \
      #     sudo ./hack/smoketest-podman-compose.sh
      - name: "Smoke test (binaries on host)"
        run: |
          sudo apt-get install -y uuid-runtime conntrack lxc iptables jq && \
          sudo sh -c 'echo "runner\tveth\tlxcbr0\t1" > /etc/lxc/lxc-usernet' && \
          for M in $(cat ./config/modules-load.d/u7s.conf); do sudo modprobe $M; done && \
          container=$(podman create --rm --privileged --entrypoint /lib/systemd/systemd --tmpfs /tmp --tmpfs /run --tmpfs /run/lock -v /sys/fs/cgroup:/sys/fs/cgroup:ro ghcr.io/$(echo -n ${{ github.repository }} | tr '[:upper:]' '[:lower:]'):latest --system --unit=multi-user.target)
          podman cp $container:/opt/usernetes/bin ./bin
          podman rm $container
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          ./hack/smoketest-binaries.sh
