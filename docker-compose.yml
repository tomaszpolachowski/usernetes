version: "3"

services:
  init-certs:
    image: ghcr.io/tomaszpolachowski/usernetes
    entrypoint: /bin/bash
    environment:
      XDG_RUNTIME_DIR: '/opt/usernetes/run'
    user: usernetes
    command:
      - -c
      - /usr/bin/mkdir -p /opt/usernetes/run && mkdir -p /opt/usernetes/run && /opt/usernetes/common/cfssl.sh --dir=/opt/usernetes/.config/usernetes --master=master --node=master --node=node-1 --node=node-2 && /bin/ls -laR /opt/usernetes/run && /usr/bin/sleep infinity
    privileged: true
    tty: true
    hostname: master
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - tmp:/tmp
      - run:/run
      - runlock:/run/lock
      - tls-master:/home/user/.config/usernetes/master
      - tls-node-1:/home/user/.config/usernetes/nodes.node-1
      - tls-node-2:/home/user/.config/usernetes/nodes.node-2
