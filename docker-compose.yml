networks:
  usernetes:
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.0.0/16
volumes:
  tmp:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=1000"
  run:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=1000"
