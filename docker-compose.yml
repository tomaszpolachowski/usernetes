networks:
  usernetes:
    driver: bridge
volumes:
  tmp:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=1000"
  run:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=1000"
  runlock:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=1000"
  tls-master:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=1000"
  tls-node-1:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=1000"
  tls-node-2:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=1000"
